stages:
  - publish

build_document:
  stage: publish

  image: mcr.microsoft.com/powershell:lts-ubuntu-22.04

  before_script:
    - apt-get update
    - apt-get install -y pandoc

  script:
    - pwsh -NoProfile -ExecutionPolicy Bypass -File ./build-publication.ps1

  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - output/